# Generic project template: a high-level description plus the three links most
# projects need — codebase, deployment, demo video. Copy this file to
# <your-id>.yaml for each project. Every field below is required except
# `links` itself and the individual link entries; drop a link you don't have.
#
# categories: one or more ML stack layers, bottom to top:
# Foundation, Models, Post-training, Inference, On-device, Platform,
# Evaluation, Agents & Apps
# A Projects tab appears only once some published project uses that layer.
#
# publish: Draft (default) keeps it off the live site; set to Publish to show it.
# url: set it to link the card to another site (e.g. a repo or a lab page)
#   instead of making a page here; the card still shows and filters as usual.
name: Sample Project
categories: [Inference, On-device]
year: 2026
status: In progress
publish: Publish
tagline: A one-line statement of what the project does and why it matters.
summary: Two or three sentences describing the problem, the approach and the outcome.
links:
  source: https://github.com/your-username/your-repository
  demo: https://your-deployment-url.example.com
  video: https://your-demo-video-url.example.com
